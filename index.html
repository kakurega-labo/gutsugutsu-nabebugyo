<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" hidden><span class="n" id="hT">60</span><span class="bar"><i id="hB"></i></span><span class="sc" id="hS">0点</span></div>

  <div id="title" class="scr">
    <canvas id="tcv"></canvas>

          <li><i>2</i><div>食べごろになったら、ほしい人の皿へ運ぶ<small>ふきだしの大きい絵が「いまほしい具」、小さい絵が「次」</small></div></li>

<script>
'use strict';
/* ============================================================
   ぐつぐつ鍋奉行　試作 v2
   芯：煮え時間のちがう具を、ほしい人の取り皿へ食べごろで配る。
   「いつ押すか」より「何を先に入れ、どれを先に見るか」（段取り）を問う。
   食べごろの幅は広め。大根は18秒かかるので、先に入れておく。
   v2.7：結果画面のひとこと質問と試遊の記録の表示を外した（log は数えるだけ残してある。画面には出ない）。
   ============================================================ */
const $=s=>document.querySelector(s);
const cv=$('#cv'),c=cv.getContext('2d');
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)}}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const K='#3A2A22';

/* ---------- 具（6種）ready=食べごろになる秒 over=煮えすぎになる秒 w=ほしがられやすさ ---------- */
const FOOD={
  shungiku:{name:'春菊',ready:1.5,over:5.5,w:2,cols:['#56B356','#2F8F49','#55632E']},
  niku:{name:'肉',ready:4,over:10,w:3,cols:['#E8546B','#C9A58F','#7D6A5F']},
  tofu:{name:'豆腐',ready:6,over:26,w:2,cols:['#FFFFFF','#FBF2D8','#D9C48F']},
  hakusai:{name:'白菜',ready:8,over:20,w:2,cols:['#A9D36B','#C4CF74','#8C8548']},
  shiitake:{name:'しいたけ',ready:10,over:24,w:2,cols:['#9A7350','#6E4A30','#40291C']},
  daikon:{name:'大根',ready:18,over:40,w:1.5,cols:['#FBFBF3','#EBD7A2','#B9975A']}
};
const FIDS=Object.keys(FOOD);
const tune={ring:true,meat:true,speed:1,time:60,bot:false};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mix3(cols,k,o){const a=hex(cols[0]),b=hex(cols[1]),d=hex(cols[2]);return'rgb('+a.map((v,i)=>{const m=v+(b[i]-v)*k;return Math.round(m+(d[i]-m)*o)}).join(',')+')'}

/* ---------- 絵：具（真上から）k=0生→1食べごろ　o=0→1煮えすぎ ---------- */
function drawFood(g,id,x,y,r,k,o){
  const f=FOOD[id],col=mix3(f.cols,k,o);
  g.save();g.translate(x,y);g.lineJoin=g.lineCap='round';g.lineWidth=Math.max(1,r*.09);g.strokeStyle=K;
  const circ=(cx,cy,rr,fl,st)=>{g.beginPath();g.arc(cx*r,cy*r,rr*r,0,7);if(fl){g.fillStyle=fl;g.fill()}if(st){g.strokeStyle=st;g.stroke()}};
  switch(id){
    case'daikon':circ(0,0,.92,col,K);circ(0,0,.6,null,k>.9?'rgba(150,105,40,.4)':'rgba(190,190,170,.7)');
      g.strokeStyle=k>.9?'rgba(150,105,40,.3)':'rgba(190,190,170,.5)';for(let i=0;i<6;i++){const a=i*Math.PI/3;g.beginPath();g.moveTo(Math.cos(a)*r*.15,Math.sin(a)*r*.15);g.lineTo(Math.cos(a)*r*.5,Math.sin(a)*r*.5);g.stroke()}break;
    case'hakusai':g.beginPath();g.ellipse(0,0,r*.98,r*.74,0,0,7);g.fillStyle=col;g.fill();g.stroke();
      g.beginPath();g.ellipse(0,r*.14,r*.62,r*.5,0,0,7);g.fillStyle=mix3(['#FAFAF0','#F2E8B8','#C9B67C'],k,o);g.fill();
      g.strokeStyle='rgba(120,130,70,.5)';g.beginPath();g.moveTo(0,r*.55);g.lineTo(0,-r*.3);g.moveTo(0,r*.2);g.lineTo(-r*.3,-r*.1);g.moveTo(0,r*.2);g.lineTo(r*.3,-r*.1);g.stroke();break;
    case'tofu':g.beginPath();g.roundRect(-r*.8,-r*.8,r*1.6,r*1.6,r*.18);g.fillStyle=col;g.fill();g.stroke();
      g.strokeStyle='rgba(255,255,255,.8)';g.beginPath();g.moveTo(-r*.5,-r*.5);g.lineTo(r*.1,-r*.5);g.stroke();
      if(o>.4){g.strokeStyle=K;g.beginPath();g.moveTo(-r*.2,-r*.8);g.lineTo(r*.05,-r*.1);g.lineTo(-r*.3,r*.3);g.lineTo(r*.1,r*.8);g.stroke()}break;
    case'shiitake':circ(0,0,.9,col,K);g.strokeStyle=mix3(['#F6ECD8','#F1DDB4','#9C8660'],k,o);g.lineWidth=r*.17;
      for(let i=0;i<3;i++){const a=i*Math.PI/3+.5;g.beginPath();g.moveTo(Math.cos(a)*r*.48,Math.sin(a)*r*.48);g.lineTo(-Math.cos(a)*r*.48,-Math.sin(a)*r*.48);g.stroke()}break;
    case'niku':{const s=1-.1*k-.16*o;g.beginPath();g.ellipse(0,0,r*1.02*s,r*.68*s,-.2,0,7);g.fillStyle=col;g.fill();g.stroke();
      g.strokeStyle=`rgba(255,255,255,${.85-.4*k})`;g.lineWidth=r*.13;g.beginPath();g.moveTo(-r*.6*s,-r*.05);g.quadraticCurveTo(-r*.2*s,-r*.45*s,r*.1*s,-r*.05);g.quadraticCurveTo(r*.35*s,r*.3*s,r*.65*s,-r*.1);g.stroke();
      g.beginPath();g.moveTo(-r*.4*s,r*.3*s);g.quadraticCurveTo(0,r*.1*s,r*.3*s,r*.4*s);g.stroke();break}
    case'shungiku':{const s=1-.14*k-.2*o;g.strokeStyle=K;g.lineWidth=r*.12;g.beginPath();g.moveTo(0,r*.9*s);g.lineTo(0,0);g.stroke();g.lineWidth=r*.08;
      [[0,-.5],[-.5,-.15],[.5,-.15],[-.32,.35],[.32,.35]].forEach(p=>circ(p[0]*s,p[1]*s,.4*s,col,K));circ(0,-.05*s,.3*s,mix3(['#7BCB6B','#3FA055','#66733A'],k,o));break}
  }
  g.restore();
}
/* ---------- 絵：顔 mood 1=うれしい -1=しょんぼり ---------- */
function drawFace(g,i,x,y,r,mood){
  g.save();g.translate(x,y);g.lineCap='round';g.lineWidth=r*.1;g.strokeStyle=K;
  const circ=(cx,cy,rr,fl,st)=>{g.beginPath();g.arc(cx*r,cy*r,rr*r,0,7);if(fl){g.fillStyle=fl;g.fill()}if(st){g.strokeStyle=st;g.stroke()}};
  const skin=['#F5CFA6','#F8D9B8','#FBDDBD','#EEC59A'][i];
  if(i===1){circ(0,-.95,.38,'#4A342B',K)}                       // おだんご
  circ(0,0,1,skin,K);
  g.fillStyle=['#33261F','#4A342B','#2A1C14','#CFCFCF'][i];g.beginPath();
  if(i===0){g.arc(0,0,r,Math.PI*1.08,Math.PI*1.92);g.closePath()}     // 父：短い髪
  else if(i===1){g.arc(0,0,r,Math.PI*1.0,Math.PI*2);g.quadraticCurveTo(0,-r*.5,-r,0)}
  else if(i===2){g.arc(0,0,r,Math.PI*.95,Math.PI*2.05);g.lineTo(r*.3,-r*.3);g.lineTo(-r*.1,-r*.55);g.lineTo(-r*.4,-r*.25);g.closePath()}
  else{g.arc(-r*.85,-r*.1,r*.22,0,7);g.arc(r*.85,-r*.1,r*.22,0,7)}                 // じいちゃん：横だけ
  g.fill();g.stroke();
  circ(-.5,.35,.17,'rgba(240,120,110,.45)');circ(.5,.35,.17,'rgba(240,120,110,.45)');
  g.strokeStyle=K;g.fillStyle=K;
  if(mood>0){for(const sx of[-1,1]){g.beginPath();g.arc(sx*r*.36,r*.08,r*.16,Math.PI*1.1,Math.PI*1.9);g.stroke()}g.beginPath();g.arc(0,r*.3,r*.3,.1,Math.PI-.1);g.closePath();g.fillStyle='#B8432F';g.fill();g.stroke()}
  else if(mood<0){for(const sx of[-1,1]){g.beginPath();g.moveTo(sx*r*.5,r*-.05);g.lineTo(sx*r*.22,r*.1);g.stroke()}g.beginPath();g.arc(0,r*.62,r*.22,Math.PI*1.15,Math.PI*1.85);g.stroke()}
  else{circ(-.36,.05,.09,K);circ(.36,.05,.09,K);g.beginPath();g.arc(0,r*.38,r*.16,.2,Math.PI-.2);g.stroke()}
  if(i===0){g.lineWidth=r*.08;g.strokeStyle=K;for(const sx of[-1,1]){g.beginPath();g.roundRect(sx*r*.36-r*.24,-r*.14,r*.48,r*.38,r*.1);g.stroke()}g.beginPath();g.moveTo(-r*.12,r*.02);g.lineTo(r*.12,r*.02);g.stroke()}

let phase='title',demo=true,T=0,timeLeft=60,score=0,pot=[],sel=null,selPos=[0,0],drag=null,pops=[],bubbles=[],meatT=0,botT=0,endT=0,lockUntil=0,stat=null,lastSec=99,shout=null,potShake=0,usedHint=0;

function reset(){
  pot=[];sel=null;drag=null;add=null;pops=[];score=0;timeLeft=tune.time;meatT=rnd(9,12);botT=0;endT=0;lastSec=99;shout=null;
  stat={good:0,ok:0,raw:0,over:0,cold:0,left:0,meat:0,jii:0};jiiSaid=false;

  eat.forEach((e,i)=>{e.want=first[i];e.next=i===0?'daikon':pickWant(e.want);e.busy=0;e.plate=null;e.mood=0;e.moodT=0;e.good=0;e.ate=0;e.raw=0;e.over=0;e.cold=0;e.meat=0;e.wantT=0});

function freeSlot(at){const used=new Set(pot.map(p=>p.slot));const fr=[];for(let i=0;i<slots.length;i++)if(!used.has(i))fr.push(i);if(!fr.length)return -1;
  if(at){let b=fr[0],bd=1e9;for(const i of fr){const d=Math.hypot(PX+slots[i][0]-at[0],PY+slots[i][1]-at[1]);if(d<bd){bd=d;b=i}}return b}   // 指を離した所にいちばん近い空き

const stateOf=p=>p.t<FOOD[p.id].ready?'raw':p.t<FOOD[p.id].over?'good':'over';

function step(dt){

    {const held=new Set([sel,drag&&drag.p].filter(Boolean));for(const p of held)p.out=(p.out||0)+dt}
    for(const p of pot){p.drop=Math.min(1,p.drop+dt*4);if(p===sel||(drag&&drag.p===p))continue;const was=stateOf(p);p.t+=dt*tune.speed;
      if(was==='raw'&&stateOf(p)==='good'&&!demo)SND.ready()}

/* ---------- 操作：つかんで運ぶ／タップで選んで、皿をタップ ---------- */
function ptr(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
let pid=null,add=null;   // add＝下の皿から持ち上げている新しい具
const inPot=(x,y)=>Math.hypot(x-PX,y-PY)<PR*1.0;
cv.addEventListener('pointerdown',e=>{
  if(phase!=='play'||pid!==null)return;const[x,y]=ptr(e);
  if(y>trayY+6*S){const i=clamp(x/(W/6)|0,0,5);pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}add={id:FIDS[i],i,x,y,sx:x,sy:y,moved:false};sel=null;SND.lift();return}
  if(sel){   // 持っている具：もう一度つかんで運ぶか、皿をタップ。鍋の別の具はつかめない
    if(Math.hypot(x-selPos[0],y-selPos[1])<FR*1.9){pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}drag={p:sel,x,y,sx:x,sy:y,moved:false,oy:y-selPos[1]};return}
    const pl=plateAt(x,y,58*S);if(pl&&pl.busy<=0){serve(sel,pl,'tap');usedHint=2;return}
    if(Math.hypot(x-PX,y-PY)<PR)pop('はしがふさがってる',selPos[0],selPos[1]-FR*1.6,'#FFE9A8');return}
  let best=null,bd=FR*1.7;for(const p of pot){const[px,py]=potPos(p),d=Math.hypot(x-px,y-py);if(d<bd){bd=d;best=p}}
  if(best){pot=pot.filter(q=>q!==best);best.out=0;   // 鍋から出した。もう鍋には戻せない
    pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}drag={p:best,x,y,sx:x,sy:y,moved:false,oy:34*S};SND.lift()}
});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;if(add){const[x,y]=ptr(e);add.x=x;add.y=y;if(Math.hypot(x-add.sx,y-add.sy)>12*S)add.moved=true;return}if(!drag)return;const[x,y]=ptr(e);drag.x=x;drag.y=y;if(Math.hypot(x-drag.sx,y-drag.sy)>12*S)drag.moved=true});
const up=e=>{if(e.pointerId!==pid)return;pid=null;
  if(add){const a=add;add=null;if(phase!=='play')return;const fy=a.y-30*S;   // 具は指の少し上に描いている
    if(inPot(a.x,fy)||inPot(a.x,a.y)){if(addFood(a.id,null,[a.x,fy])&&usedHint<1)usedHint=1}

  sel=d.p;selPos=[clamp(d.x,40*S,W-40*S),clamp(d.y-d.oy,70*S,trayY-40*S)]};   // 皿以外で離したら、はしで持ったまま

  const br=g.createRadialGradient(x,y,R*.1,x,y,R*.88);br.addColorStop(0,'#F0D08A');br.addColorStop(1,'#D9A85A');
  g.fillStyle=br;g.beginPath();g.arc(x,y,R*.86,0,7);g.fill();g.strokeStyle='#1E1512';g.lineWidth=2*S;g.stroke();
  for(const it of items){const a=(it.slot-1)*Math.PI/3+Math.PI/6,rr=it.slot?R*.56:0;drawFood(g,it.id,x+Math.cos(a)*rr,y+Math.sin(a)*rr+(steam?Math.sin(T*2+it.slot)*1.2*S:0),R*.2*(steam?1+Math.sin(T*5+it.slot)*.03:1),it.k,it.o)}
  if(steam){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2.5*S;g.lineCap='round';
    for(let i=0;i<5;i++){const ph=(T*.45+i/5)%1,sx=x+(i-2)*R*.32,sy=y-R*.2-ph*R*1.1;g.globalAlpha=Math.sin(ph*Math.PI)*.8;
      g.beginPath();g.moveTo(sx,sy);g.quadraticCurveTo(sx+9*S,sy-12*S,sx,sy-24*S);g.quadraticCurveTo(sx-9*S,sy-36*S,sx,sy-48*S);g.stroke()}

}

function buildFoods(){const box=$('#foods');box.innerHTML='';FIDS.forEach(id=>{const f=FOOD[id],d=document.createElement('div'),cc=document.createElement('canvas');
  cc.width=cc.height=Math.round(32*S*DPR);const g=cc.getContext('2d');g.scale(DPR,DPR);drawFood(g,id,16*S,16*S,13*S,1,0);
  d.append(cc);d.insertAdjacentHTML('beforeend',`<b>${f.name}</b><span>${f.ready}秒</span><em>くたくたは${f.over}秒</em>`);box.append(d)})}
$('#bHow').addEventListener('click',()=>{buildFoods();$('#howto').hidden=false});
$('#bHowClose').addEventListener('click',()=>$('#howto').hidden=true);
$('#howto').addEventListener('click',e=>{if(e.target.id==='howto')$('#howto').hidden=true});
/* ---------- 共有画像（1200×630）：左に火を止めた鍋と家族、右に称号と点 ---------- */
const SHARE_URL='https://gutsugutsu-nabebugyo.pages.dev/';   // 公開版では build.py が入れる
let lastRank='',shareFile=null,shareURL=null,shareBusy=null;
function fontsReady(){if(!document.fonts||!document.fonts.load)return Promise.resolve();
  return Promise.race([Promise.all(['64px "Yusei Magic"','900 30px "Zen Maru Gothic"','700 24px "Zen Maru Gothic"'].map(f=>document.fonts.load(f,'ぐつぐつ鍋奉行うまい点'))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{})}
function makeShare(){shareBusy=fontsReady().then(()=>new Promise(res=>{
  const cw=1200,ch=630,cv2=document.createElement('canvas');cv2.width=cw;cv2.height=ch;const g=cv2.getContext('2d');
  const keepS=S;S=630/330;
  g.fillStyle='#6B4226';g.fillRect(0,0,cw,ch);g.strokeStyle='rgba(42,28,20,.22)';g.lineWidth=4;for(let y=50;y<ch;y+=140){g.beginPath();g.moveTo(0,y);g.lineTo(cw,y);g.stroke()}
  tableArt(g,630,630);S=keepS;
  // 右：生成りの紙
  g.fillStyle='#D2492F';g.beginPath();g.roundRect(640,30,524,564,28);g.fill();g.fillStyle='#FFF6E3';g.beginPath();g.roundRect(640,40,524,554,28);g.fill();
  const cx=902;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#8a7a70';g.font='900 26px "Zen Maru Gothic",sans-serif';g.fillText('きょうの鍋',cx,100);
  let fs=60;g.font=`${fs}px "Yusei Magic","Zen Maru Gothic",sans-serif`;while(g.measureText(lastRank).width>460&&fs>30){fs-=2;g.font=`${fs}px "Yusei Magic","Zen Maru Gothic",sans-serif`}
  g.fillStyle='#D2492F';g.fillText(lastRank,cx,170);
  g.fillStyle='#2A1C14';g.font='110px "Yusei Magic","Zen Maru Gothic",sans-serif';const sw=g.measureText(String(score)).width;g.font='40px "Yusei Magic","Zen Maru Gothic",sans-serif';const pw=g.measureText('点').width;
  g.font='110px "Yusei Magic","Zen Maru Gothic",sans-serif';g.textAlign='left';g.fillText(String(score),cx-(sw+pw+8)/2,282);g.font='40px "Yusei Magic","Zen Maru Gothic",sans-serif';g.fillText('点',cx-(sw+pw+8)/2+sw+8,300);
  const items=[['うまい！',stat.good],['まだ固い',stat.raw],['くたくた',stat.over],['冷めた',stat.cold]];
  items.forEach(([k,v],i)=>{const bx=676+i*116,by=360;g.fillStyle='#F3E4C4';g.beginPath();g.roundRect(bx,by,104,92,16);g.fill();g.textAlign='center';
    g.fillStyle='#2A1C14';g.font='900 40px "Zen Maru Gothic",sans-serif';g.fillText(String(v),bx+52,by+38);g.font='900 19px "Zen Maru Gothic",sans-serif';g.fillText(k,bx+52,by+74)});
  g.textAlign='center';g.fillStyle='#2A1C14';g.font='44px "Yusei Magic","Zen Maru Gothic",sans-serif';g.fillText('ぐつぐつ鍋奉行',cx,494);
  g.fillStyle='#8a7a70';g.font='700 22px "Zen Maru Gothic",sans-serif';g.fillText('#ぐつぐつ鍋奉行',cx,SHARE_URL?540:552);if(SHARE_URL){g.font='700 19px "Zen Maru Gothic",sans-serif';g.fillText(SHARE_URL.replace(/^https?:\/\//,'').replace(/\/$/,''),cx,570)}
  cv2.toBlob(b=>{shareFile=b?new File([b],'gutsugutsu-nabebugyo.png',{type:'image/png'}):null;if(shareURL)URL.revokeObjectURL(shareURL);shareURL=b?URL.createObjectURL(b):null;res()},'image/png');
}))}
async function shareImage(){
  if(shareBusy)await shareBusy;if(!shareFile)return;
  const text=$('#result').dataset.text;
  try{if(navigator.canShare&&navigator.canShare({files:[shareFile]})){await navigator.share({files:[shareFile],text});return}}catch(e){if(e&&e.name==='AbortError')return}
  $('#shareImg').src=shareURL;$('#shareView').hidden=false;   // 共有シートが使えないときは、画像を出して長押しで保存
}
let last=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;step(dt);draw();if(!$('#title').hidden)drawTitle();if(!$('#result').hidden)drawResult();requestAnimationFrame(frame)}
window.addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
fit();reset();requestAnimationFrame(frame);
</script>
</body>
